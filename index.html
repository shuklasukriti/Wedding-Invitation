<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#2a0d0b">
    <meta name="description" content="Sukriti & Sidhant: Wedding Invitation">
    <title>Sukriti & Sidhant: Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@400;500;600&family=Rozha+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main id="invitation-app" class="invitation-app" aria-live="polite">
      <div id="loading-state" class="loading-state" role="status">
        <span class="loading-mark" aria-hidden="true"></span>
        <p id="loading-text"></p>
      </div>

      <section id="envelope-scene" class="envelope-scene" hidden>
        <div class="table-vignette" aria-hidden="true"></div>
        <div id="envelope" class="envelope">
          <div class="envelope-backplate"></div>
          <div class="invitation-card-preview" aria-hidden="true">
            <span class="preview-ornament"></span>
            <strong id="preview-monogram"></strong>
          </div>
          <div class="flap flap-left"></div>
          <div class="flap flap-right"></div>
          <div class="flap flap-bottom"></div>
          <div class="flap flap-top">
            <div class="flap-top-surface"></div>
            <div class="flap-inner-shadow"></div>
            <button id="wax-seal" class="wax-seal" type="button">
              <img id="wax-seal-image" alt="" hidden>
              <span id="seal-monogram" class="seal-monogram"></span>
            </button>
          </div>
          <div class="envelope-label" aria-hidden="true">
            <span id="envelope-label-to"></span>
            <strong id="envelope-label-guest"></strong>
          </div>
        </div>
        <p id="seal-prompt" class="seal-prompt"></p>
      </section>

      <section id="book-stage" class="book-stage" hidden>
        <div id="book-shell" class="book-shell">
          <div id="book-container" class="book-container"></div>
        </div>
        <nav id="book-controls" class="book-controls">
          <button id="previous-page" class="page-control" type="button">
            <span aria-hidden="true">‹</span>
          </button>
          <p id="page-status" class="page-status"></p>
          <button id="next-page" class="page-control" type="button">
            <span aria-hidden="true">›</span>
          </button>
        </nav>
      </section>

      <section id="error-state" class="error-state" hidden role="alert">
        <h1 id="error-title"></h1>
        <p id="error-body"></p>
      </section>
    </main>
  </body>
</html>
