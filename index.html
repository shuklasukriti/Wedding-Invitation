<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#2a0d0b">
    <meta name="description" content="Sukriti & Sidhant: Wedding Invitation">
    <title>Sukriti & Sidhant: Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@400;500;600&family=Rozha+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body class="intro-active">
    <main id="invitation-app" class="invitation-app">
      <div id="loading-state" class="loading-state" role="status">
        <span class="loading-mark" aria-hidden="true"></span>
        <p id="loading-text"></p>
      </div>

      <section id="intro-scene" class="intro-scene" hidden>
        <video id="intro-video" class="intro-video" preload="auto" playsinline disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
        <button id="intro-play" class="intro-play" type="button" disabled>
          <span class="intro-play-mark" aria-hidden="true"></span>
          <span id="intro-prompt" class="intro-prompt" role="status"></span>
        </button>
      </section>

      <section id="book-stage" class="book-stage" hidden inert aria-hidden="true">
        <div id="book-shell" class="book-shell">
          <div id="book-container" class="book-container" tabindex="-1"></div>
        </div>
      </section>

      <section id="error-state" class="error-state" hidden role="alert">
        <h1 id="error-title"></h1>
        <p id="error-body"></p>
      </section>
    </main>
  </body>
</html>
